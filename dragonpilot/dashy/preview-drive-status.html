<script>/* Display-only road information supplied by Dashy's shared server worker. */
(() => {
  'use strict';
  function getRoadDisplay(sm, now = Date.now()) {
    const info = sm?.roadInfo;
    const received = Number(sm?.recv_time?.roadInfo) * 1000;
    if (!info || !Number.isFinite(received) || received > now || now - received > 4000) return null;
    const kph = info.speedLimitKph;
    const imperial = sm?.carState?.speedUnit === 'mph';
    const limit = Number.isFinite(kph) && kph > 0 && kph <= 200
      ? String(Math.round(imperial ? kph / 1.609344 : kph)) : '';
    const name = String(info.roadName || '');
    const aheadKph = info.aheadSpeedLimitKph;
    const distance = info.aheadDistanceM;
    let ahead = '';
    if (limit && Number.isFinite(aheadKph) && aheadKph > 0 && aheadKph <= 200 && aheadKph !== kph
        && Number.isFinite(distance) && distance >= 0) {
      const nextLimit = Math.round(imperial ? aheadKph / 1.609344 : aheadKph);
      let dist;
      if (!imperial) {
        dist = distance < 50 ? 'Near' : distance >= 1000 ? `${(distance / 1000).toFixed(1)} km`
          : `${Math.round(distance / (distance < 200 ? 10 : 100)) * (distance < 200 ? 10 : 100)} m`;
      } else {
        const feet = distance * 3.28084;
        dist = feet < 100 ? 'Near' : feet >= 900 ? `${(distance * 0.000621371).toFixed(1)} mi`
          : `${Math.round(feet / (feet < 500 ? 50 : 100)) * (feet < 500 ? 50 : 100)} ft`;
      }
      ahead = `AHEAD · ${nextLimit} ${imperial ? 'mph' : 'km/h'} · ${dist}`;
    }
    return limit || name ? { limit, name, ahead, unit: imperial ? 'mph' : 'km/h' } : null;
  }
  window.DashyRoadInfo = { getRoadDisplay };
  if (typeof document === 'undefined') return;
  const host = document.getElementById('hud-page-content');
  if (!host) return;
  const panel = document.createElement('div');
  panel.id = 'road-info-hud';
  panel.hidden = true;
  const sign = document.createElement('div');
  sign.className = 'road-info-limit';
  const name = document.createElement('div');
  name.className = 'road-info-name';
  const ahead = document.createElement('div');
  ahead.className = 'road-info-ahead';
  panel.append(sign, ahead, name);
  host.appendChild(panel);
  function update() {
    const page = document.getElementById('hud-page');
    const data = !document.hidden && page?.getClientRects().length
      && getComputedStyle(page).visibility !== 'hidden' ? getRoadDisplay(window.sm) : null;

    ahead.hidden = !data?.ahead;

  window.addEventListener('pagehide', event => {
    if (event.persisted) return;
    window.clearInterval(timer);
    document.removeEventListener('visibilitychange', update);
  }, { once: true });
  update();
})();
</script>

    const hasSpeed = Number.isFinite(traffic.nextSpeed) && traffic.nextSpeed > 0 && traffic.nextSpeed <= 150

      const text = `${event.isCurrentSection ? '目前路段' : '前方'}：${description}`;
      descriptions.push(text);

    return {
      speed: [speed, congestion].filter(Boolean).join(' · '),
      event: descriptions.join(' ／ '),
      congestion: hasSpeed && congestion ? traffic.congestion : 'unknown',
    };
  }

  function getScrollMetrics(textWidth, lineWidth) {
    const overflow = Math.max(0, textWidth - lineWidth);
    return { overflow, duration: Math.max(2, overflow / 35) };
  }

  // Expose pure formatting for diagnostics and tests without the vehicle/UI runtime.
  window.DashyTraffic = { getDisplay, getScrollMetrics };
  if (typeof document === 'undefined') return;

  const host = document.getElementById('hud-page-content');
  if (!host) return;
  const panel = document.createElement('div');
  panel.id = 'traffic-hud';
  panel.hidden = true;
  const speedLine = document.createElement('div');
  speedLine.className = 'traffic-hud-speed';
  const eventLine = document.createElement('div');
  eventLine.className = 'traffic-hud-event';
  const eventText = document.createElement('span');
  eventLine.appendChild(eventText);
  panel.append(speedLine, eventLine);
  host.appendChild(panel);

  function clearEvent() {
    eventLine.hidden = true;
    eventText.classList.remove('traffic-hud-scroll');
    eventText.textContent = '';
    eventText.style.removeProperty('--traffic-scroll');
    eventText.style.removeProperty('--traffic-duration');
  }

  function fitEvent() {
    if (panel.hidden || eventLine.hidden || !eventText.textContent) {
      eventText.classList.remove('traffic-hud-scroll');
      return;
    }
    const { overflow, duration } = getScrollMetrics(eventText.scrollWidth, eventLine.clientWidth);
    eventText.style.setProperty('--traffic-scroll', `${-overflow}px`);
    eventText.style.setProperty('--traffic-duration', `${duration}s`);
    eventText.classList.toggle('traffic-hud-scroll', overflow > 1);
  }

  function update() {
    const page = document.getElementById('hud-page');
    const display = !document.hidden && page && page.getClientRects().length
      && getComputedStyle(page).visibility !== 'hidden' ? getDisplay(window.sm) : null;
    panel.hidden = !display;
    if (!display) {
      speedLine.textContent = '';
      clearEvent();
      return;
    }
    panel.dataset.congestion = display.congestion;
    speedLine.textContent = display.speed;
    speedLine.hidden = !display.speed;
    if (!display.event) {
      clearEvent();
      return;
    }
    eventLine.hidden = false;
    if (eventText.textContent !== display.event) {
      eventText.classList.remove('traffic-hud-scroll');
      eventText.textContent = display.event;
      // Commit removal before reapplying the class so a new event starts at the beginning.
      void eventText.offsetWidth;
    }
    fitEvent();
  }

  const timer = window.setInterval(update, 250);
  const observer = typeof ResizeObserver === 'function' ? new ResizeObserver(fitEvent) : null;
  observer?.observe(panel);
  document.addEventListener('visibilitychange', update);
  window.addEventListener('pagehide', event => {
    if (event.persisted) return;
    window.clearInterval(timer);
    observer?.disconnect();
    document.removeEventListener('visibilitychange', update);
  }, { once: true });
  update();
})();
</script>

<script>/* Keep corner information and TDX in separate rows on small HUD viewports. */
(() => {
  'use strict';
  function getLayout(width, height, cornerHeight, trafficHeight, topInset = 8) {
    const compact = width < 760 || height < 420;
    if (!compact) return { compact, scale: 1, top: height * 0.3 };
    const available = Math.max(0, height - topInset - trafficHeight - 16);
    const scale = trafficHeight && cornerHeight ? Math.min(1, available / cornerHeight) : 1;
    const top = trafficHeight ? Math.max(height * 0.3, topInset + cornerHeight * scale + 8) : height * 0.3;
    return { compact, scale, top };
  }
  window.DashyHudLayout = { getLayout };
  if (typeof document === 'undefined') return;
  const host = document.getElementById('hud-page-content');
  if (!host) return;
  function update() {
    if (document.hidden || !host.clientWidth || !host.clientHeight) return;
    const compact = host.clientWidth < 760 || host.clientHeight < 420;
    host.classList.toggle('hud-compact-layout', compact);
    const corners = ['road-info-hud', 'drive-status'].map(id => document.getElementById(id))
      .filter(node => node && !node.hidden && node.getClientRects().length);
    const cornerHeight = Math.max(0, ...corners.map(node => node.offsetHeight));
    const topInset = Math.max(8, ...corners.map(node => node.offsetTop));
    const traffic = document.getElementById('traffic-hud');
    const trafficHeight = traffic && !traffic.hidden ? traffic.offsetHeight : 0;
    const layout = getLayout(host.clientWidth, host.clientHeight, cornerHeight, trafficHeight, topInset);
    host.style.setProperty('--hud-corner-scale', String(layout.scale));
    if (traffic) {
      if (compact) traffic.style.top = `${layout.top}px`;
      else traffic.style.removeProperty('top');
    }
  }
  const timer = window.setInterval(update, 250);
  window.addEventListener('resize', update);
  document.addEventListener('visibilitychange', update);
  window.addEventListener('pagehide', event => {
    if (event.persisted) return;
    window.clearInterval(timer); window.removeEventListener('resize', update);
    document.removeEventListener('visibilitychange', update);
  }, { once: true });
  update();
})();
</script>
